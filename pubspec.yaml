  flutter_animate: ^4.5.0

  # Navigation
  go_router: ^13.2.0

  # Charts & Progress
  # fl_chart: ^0.66.0  # Not currently used
  percent_indicator: ^4.2.3

  # Camera & AR (for future features)
  # camera: ^0.10.5+9  # Not currently used
  # ar_flutter_plugin: ^0.7.3  # Commented out due to dependency conflict

  # AI & ML
  # tflite_flutter: ^0.10.4  # Not currently used

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
