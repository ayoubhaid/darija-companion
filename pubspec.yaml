  flutter:
    sdk: flutter

  # UI & Design
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  # flutter_svg: ^2.0.9  # Not currently used
  # lottie: ^3.0.0  # Not currently used
  # shimmer: ^3.0.0  # Not currently used
  cached_network_image: ^3.3.1

  # State Management
  # provider: ^6.1.1  # Not used - using Riverpod instead
  riverpod: ^2.4.9
  flutter_riverpod: ^2.4.9
  # riverpod_annotation: ^2.3.3  # Not currently used

  # Code Generation
  json_annotation: ^4.8.1
  # build_runner: ^2.4.7  # Not currently used

  # Firebase - Temporarily disabled for web compatibility
  # firebase_core: ^2.24.2
  # firebase_auth: ^4.15.3
  # cloud_firestore: ^4.13.6
  # firebase_storage: ^11.5.6
  # firebase_analytics: ^10.7.4
  # firebase_messaging: ^14.7.10

  # Audio & Speech
  # audioplayers: ^5.2.1  # Not currently used
  # speech_to_text: ^6.6.0  # Not currently used
  # flutter_tts: ^3.8.5  # Not currently used
  # record: ^5.0.4  # Not currently used

  # Local Storage & Offline
  # shared_preferences: ^2.2.2  # Not currently used
  # sqflite: ^2.3.0  # Not currently used
  # path_provider: ^2.1.1  # Not currently used
  # hive: ^2.2.3  # Not currently used
  # hive_flutter: ^1.1.0  # Not currently used

  # Networking & API
  # http: ^1.1.2  # Not currently used
  # dio: ^5.4.0  # Not currently used
  # connectivity_plus: ^5.0.2  # Not currently used

  # Utilities
  # intl: ^0.19.0  # Not currently used
  # uuid: ^4.2.1  # Not currently used
  # permission_handler: ^10.4.5  # Not currently used
  # device_info_plus: ^9.1.1  # Not currently used
